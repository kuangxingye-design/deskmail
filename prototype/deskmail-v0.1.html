<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeskMail v0.1 · 磨砂玻璃邮件卡片原型</title>
<style>
  :root {
    --glass: rgba(255, 255, 255, 0.10);
    --border: rgba(255, 255, 255, 0.22);
    --text: #f5f8ff;
    --muted: rgba(235, 242, 255, 0.62);
    --faint: rgba(235, 242, 255, 0.38);
    --accent: #8cc8ff;
    --important: #ffb86b;
    --critical: #ff6f86;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }

  body {
    margin: 0;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    color: var(--text);
    background: #0b1220;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 桌面背景 ---------- */
  .wallpaper {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(900px 600px at 18% 20%, #1d4ed8 0%, transparent 60%),
      radial-gradient(800px 600px at 82% 72%, #7c3aed 0%, transparent 62%),
      radial-gradient(700px 500px at 55% 10%, #0ea5e9 0%, transparent 55%),
      linear-gradient(135deg, #0b1220 0%, #131a2b 48%, #0a0f1a 100%);
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.5;
    pointer-events: none;
  }
  .b1 { width: 420px; height: 420px; background: #2563eb; left: -90px; top: 8%; }
  .b2 { width: 480px; height: 480px; background: #a855f7; right: -120px; bottom: -80px; }
  .b3 { width: 320px; height: 320px; background: #06b6d4; right: 20%; top: -90px; }

  /* 背后的“工作窗口”，用来示意卡片始终置顶 */
  .faux-window {
    position: fixed;
    left: 44%;
    top: 16%;
    width: 560px;
    height: 460px;
    padding: 18px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0.85;
    pointer-events: none;
  }
  .faux-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .faux-dots { display: flex; gap: 6px; }
  .faux-dots span {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
  }
  .faux-title {
    font-size: 11px;
    letter-spacing: 0.4px;
    color: rgba(255, 255, 255, 0.30);
  }
  .faux-line {
    height: 10px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.07);
    margin: 14px 0;
  }
  .faux-line.w80 { width: 80%; }
  .faux-line.w60 { width: 60%; }
  .faux-line.w40 { width: 40%; }
  .faux-block {
    height: 132px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    margin-top: 24px;
  }

  /* ---------- 顶部操作提示 ---------- */
  .desktop-hint {
    position: fixed;
    top: 26px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    padding: 9px 16px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }
  kbd {
    font-family: inherit;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: var(--text);
  }

  /* ---------- 磨砂玻璃卡片 ---------- */
  .card {
    position: fixed;
    left: 8vw;
    top: 12vh;
    width: min(92vw, 420px);
    height: min(78vh, 640px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 22px;
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.06));
    border: 1px solid var(--border);
    box-shadow:
      0 30px 90px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(30px) saturate(160%);
    -webkit-backdrop-filter: blur(30px) saturate(160%);
    outline: none;
    z-index: 10;
    transition: opacity 0.22s ease, transform 0.22s ease, box-shadow 0.2s ease;
  }
  .card.is-hidden {
    opacity: 0;
    transform: scale(0.97) translateY(8px);
    pointer-events: none;
  }
  .card.focused {
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.40),
      0 30px 90px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  .card-header {
    position: relative;
    z-index: 20;
    flex: none;
    padding: 18px 18px 10px;
  }
  .title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .title-row h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 650;
    letter-spacing: 0.2px;
  }
  .subtitle {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  .subtitle strong { color: var(--text); font-weight: 600; }

  .icon-btn {
    flex: none;
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.08);
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    transition: 0.15s;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.14); color: var(--text); }

  .header-actions { display: flex; align-items: center; gap: 8px; }
  .back-pill {
    display: none;
    align-items: center;
    gap: 4px;
    padding: 7px 11px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.08);
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: 0.15s;
  }
  .back-pill:hover { background: rgba(255, 255, 255, 0.15); }
  .card.detail-mode .back-pill { display: inline-flex; }
  .card.detail-mode #settingsBtn { display: none; }

  /* 账号筛选：按账号（不是供应商），长地址收进下拉菜单 */
  .account-filter {
    position: relative;
    z-index: 40;
    margin-top: 14px;
  }
  .filter-trigger {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    transition: 0.15s;
  }
  .filter-trigger:hover { background: rgba(255, 255, 255, 0.09); }
  .filter-label {
    flex: 1;
    text-align: left;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .filter-count { flex: none; color: var(--faint); font-size: 11px; }
  .chevron {
    flex: none;
    color: var(--muted);
    font-size: 10px;
    transition: transform 0.15s;
  }
  .filter-trigger[aria-expanded="true"] .chevron { transform: rotate(180deg); }

  .filter-menu {
    position: fixed;
    z-index: 999;
    max-height: min(320px, 52vh);
    overflow-y: auto;
    padding: 6px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: #0e1626;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
  }
  .filter-menu::-webkit-scrollbar { width: 5px; }
  .filter-menu::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.16);
    border-radius: 99px;
  }
  .filter-option {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 8px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    text-align: left;
    cursor: pointer;
  }
  .filter-option:hover,
  .filter-option.active { background: rgba(255, 255, 255, 0.08); }
  .filter-option .opt-main { flex: 1; min-width: 0; }
  .filter-option .opt-alias {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
  }
  .filter-option .opt-alias em {
    margin-left: 5px;
    color: var(--faint);
    font-style: normal;
    font-weight: 400;
    font-size: 10.5px;
  }
  .filter-option .opt-email {
    display: block;
    margin-top: 2px;
    color: var(--faint);
    font-size: 10.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .filter-option .opt-count { flex: none; color: var(--faint); font-size: 11px; }
  .filter-option .check { flex: none; width: 14px; color: var(--accent); font-size: 11px; }
  .filter-sep {
    height: 1px;
    margin: 6px 4px;
    background: rgba(255, 255, 255, 0.08);
  }

  .chip-avatar {
    flex: none;
    width: 18px;
    height: 18px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--acct-color, rgba(255, 255, 255, 0.22));
    color: #0b1220;
    font-size: 9px;
    font-weight: 700;
  }
  .chip-avatar.all {
    background: rgba(255, 255, 255, 0.22);
    color: var(--text);
  }

  .card.detail-mode .account-filter,
  .card.detail-mode .subtitle { display: none; }

  /* ---------- 列表 ---------- */
  .view {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .mail-list {
    list-style: none;
    margin: 0;
    padding: 4px 10px 12px;
    overflow-y: auto;
    flex: 1;
  }
  .mail-list::-webkit-scrollbar,
  .detail-scroll::-webkit-scrollbar { width: 5px; }
  .mail-list::-webkit-scrollbar-thumb,
  .detail-scroll::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.16);
    border-radius: 99px;
  }

  .mail-row {
    display: flex;
    gap: 10px;
    padding: 12px 10px;
    border-radius: 14px;
    cursor: pointer;
    outline: none;
    transition: background 0.15s;
  }
  .mail-row:hover,
  .mail-row:focus-visible { background: rgba(255, 255, 255, 0.07); }
  .mail-row + .mail-row { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05); }

  .unread-dot {
    flex: none;
    width: 7px;
    height: 7px;
    margin-top: 7px;
    border-radius: 50%;
    background: transparent;
  }
  .mail-row.unread .unread-dot {
    background: var(--accent);
    box-shadow: 0 0 10px rgba(140, 200, 255, 0.6);
  }

  .mail-main { flex: 1; min-width: 0; }
  .mail-top,
  .mail-bottom { display: flex; align-items: center; gap: 7px; }
  .mail-bottom { margin-top: 5px; }

  .acct {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 1px 6px 1px 2px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.10);
    background: rgba(255, 255, 255, 0.06);
    color: var(--acct-color, var(--accent));
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .acct-avatar {
    flex: none;
    width: 14px;
    height: 14px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--acct-color, var(--accent));
    color: #0b1220;
    font-size: 8px;
    font-weight: 700;
  }
  .sender {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13.5px;
    color: var(--muted);
  }
  .mail-row.unread .sender { color: var(--text); font-weight: 600; }
  .time {
    flex: none;
    font-size: 11px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  .subject {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12.5px;
    color: var(--muted);
  }
  .mail-row.unread .subject { color: rgba(245, 248, 255, 0.90); }

  .imp-badge {
    flex: none;
    padding: 2px 7px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 600;
  }
  .imp-badge.important {
    color: var(--important);
    background: rgba(255, 184, 107, 0.12);
    border: 1px solid rgba(255, 184, 107, 0.25);
  }
  .imp-badge.critical {
    color: var(--critical);
    background: rgba(255, 111, 134, 0.12);
    border: 1px solid rgba(255, 111, 134, 0.28);
  }

  .empty {
    flex: 1;
    display: grid;
    place-items: center;
    color: var(--faint);
    font-size: 12.5px;
  }

  /* ---------- 详情 ---------- */
  .detail-view { padding: 0 18px 12px; }

  .detail-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
  }
  .detail-subject {
    margin: 0 0 10px;
    font-size: 18px;
    line-height: 1.35;
    font-weight: 650;
  }
  .detail-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .detail-email {
    color: var(--faint);
    font-size: 10.5px;
    word-break: break-all;
  }

  .importance {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 16px;
    padding: 4px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .importance .label {
    padding: 0 8px 0 6px;
    font-size: 11px;
    color: var(--faint);
  }
  .imp-btn {
    flex: 1;
    padding: 6px 8px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: 0.15s;
  }
  .imp-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }
  .imp-btn.active[data-importance="normal"] {
    background: rgba(255, 255, 255, 0.90);
    color: #101827;
    font-weight: 600;
  }
  .imp-btn.active[data-importance="important"] {
    background: rgba(255, 184, 107, 0.22);
    color: var(--important);
    font-weight: 600;
    box-shadow: inset 0 0 0 1px rgba(255, 184, 107, 0.35);
  }
  .imp-btn.active[data-importance="critical"] {
    background: rgba(255, 111, 134, 0.22);
    color: var(--critical);
    font-weight: 600;
    box-shadow: inset 0 0 0 1px rgba(255, 111, 134, 0.35);
  }

  .mail-body {
    font-size: 13.5px;
    line-height: 1.75;
    color: rgba(245, 248, 255, 0.86);
  }
  .mail-body p { margin: 0 0 12px; }
  .mail-body .code {
    display: inline-block;
    margin: 2px 0 14px;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.08);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #fff;
  }

  .inline-image {
    position: relative;
    margin: 16px 0;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.14);
  }
  .inline-image img { display: block; width: 100%; height: auto; }
  .img-copy {
    position: absolute;
    right: 10px;
    bottom: 10px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(10, 15, 25, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #fff;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    opacity: 0;
    transform: translateY(4px);
    transition: 0.18s;
  }
  .inline-image:hover .img-copy,
  .img-copy:focus-visible { opacity: 1; transform: none; }

  .detail-actions {
    flex: none;
    padding: 10px 0 4px;
    border-top: 1px solid rgba(255, 255, 255, 0.07);
  }
  .primary-btn {
    width: 100%;
    padding: 11px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.90);
    color: #0f172a;
    font-size: 13px;
    font-weight: 650;
    font-family: inherit;
    cursor: pointer;
    transition: 0.15s;
  }
  .primary-btn:hover { background: #fff; }

  /* ---------- 账号管理 ---------- */
  .account-sheet {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    padding: 18px;
    border-radius: 22px;
    background: linear-gradient(160deg, #111827 0%, #0f172a 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }
  .sheet-head h2 { margin: 0; font-size: 18px; font-weight: 650; }
  .sheet-note {
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.55;
  }
  .account-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    list-style: none;
    margin: 0;
    padding: 0 2px;
  }
  .account-list::-webkit-scrollbar { width: 5px; }
  .account-list::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.16);
    border-radius: 99px;
  }
  .account-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  }
  .account-item .avatar {
    flex: none;
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--acct-color);
    color: #0b1220;
    font-size: 12px;
    font-weight: 700;
  }
  .account-item .info { flex: 1; min-width: 0; }
  .account-item .alias { font-size: 13px; font-weight: 600; }
  .account-item .alias em {
    margin-left: 4px;
    color: var(--faint);
    font-style: normal;
    font-weight: 400;
    font-size: 10.5px;
  }
  .account-item .email {
    margin-top: 2px;
    color: var(--faint);
    font-size: 11px;
    word-break: break-all;
  }
  .account-item .status {
    flex: none;
    color: #7ee2b8;
    font-size: 10px;
  }
  .account-sheet .primary-btn { margin-top: 12px; }

  /* ---------- 页脚与提示 ---------- */
  .card-footer {
    flex: none;
    padding: 9px 18px 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.07);
    background: rgba(10, 15, 25, 0.10);
    font-size: 10.5px;
    color: var(--faint);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 6vh;
    z-index: 50;
    padding: 9px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #fff;
    font-size: 12px;
    opacity: 0;
    transform: translate(-50%, 12px);
    pointer-events: none;
    transition: 0.2s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 900px) {
    .faux-window { display: none; }
    .card { left: 4vw; top: 10vh; }
    .desktop-hint { font-size: 11px; padding: 8px 12px; }
  }
  @media (max-height: 720px) {
    .card { top: 6vh; height: 88vh; }
  }
</style>
</head>
<body>

  <div class="wallpaper" aria-hidden="true"></div>
  <div class="blob b1" aria-hidden="true"></div>
  <div class="blob b2" aria-hidden="true"></div>
  <div class="blob b3" aria-hidden="true"></div>

  <div class="faux-window" aria-hidden="true">
    <div class="faux-bar">
      <div class="faux-dots"><span></span><span></span><span></span></div>
      <div class="faux-title">工作窗口（示意）</div>
    </div>
    <div class="faux-line w80"></div>
    <div class="faux-line w60"></div>
    <div class="faux-line w40"></div>
    <div class="faux-block"></div>
    <div class="faux-line w60"></div>
  </div>

  <div class="desktop-hint" id="desktopHint">
    原型：按 <kbd>H</kbd> 隐藏卡片 · 点击卡片后 <kbd>Alt</kbd> + 方向键移动
  </div>

  <main class="card" id="card" tabindex="0" aria-label="DeskMail 邮件卡片">

  /* ---------------- 复制 ---------------- */
  function fallbackCopyText(text) {
    var area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    var ok = false;
    try {
      ok = document.execCommand("copy");
    } catch (err) {
      ok = false;
    }
    area.remove();
    return ok;
  }

  async function copyCurrentText() {
    if (!state.current) return;
    var text = state.current.plain;
    try {
      await navigator.clipboard.writeText(text);
      showToast("已复制正文");
    } catch (err) {
      if (fallbackCopyText(text)) {
        showToast("已复制正文");
      } else {
        showToast("当前环境不允许写入剪贴板");
      }
    }
  }

  async function copyImage(img) {
    if (!navigator.clipboard || typeof window.ClipboardItem === "undefined") {
      showToast("当前浏览器不支持复制图片");
      return;
    }

    try {
      var image = new Image();
      var loaded = new Promise(function (resolve, reject) {
        image.onload = function () { resolve(); };
        image.onerror = function () { reject(new Error("image load failed")); };
      });
      image.src = img.src;
      await loaded;

      var canvas = document.createElement("canvas");
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;
      canvas.getContext("2d").drawImage(image, 0, 0);

      var blob = await new Promise(function (resolve) {
        canvas.toBlob(resolve, "image/png");
      });
      if (!blob) throw new Error("toBlob failed");

      await navigator.clipboard.write([
        new ClipboardItem({ "image/png": blob })
      ]);
      showToast("已复制图片");
    } catch (err) {
      showToast("复制图片失败，请用真实应用验证");
    }
  }

  /* ---------------- 事件 ---------------- */
  function positionFilterMenu() {
    var rect = els.filterTrigger.getBoundingClientRect();
    var width = Math.min(rect.width, window.innerWidth - 16);
    var left = Math.min(Math.max(8, rect.left), window.innerWidth - width - 8);
    els.filterMenu.style.width = width + "px";
    els.filterMenu.style.left = left + "px";
    els.filterMenu.style.top = (rect.bottom + 8) + "px";
  }

  function openFilterMenu() {
    positionFilterMenu();
    els.filterMenu.hidden = false;
    els.filterTrigger.setAttribute("aria-expanded", "true");
  }

  function closeFilterMenu() {
    els.filterMenu.hidden = true;
    els.filterTrigger.setAttribute("aria-expanded", "false");
  }

  els.filterTrigger.addEventListener("click", function (event) {
    event.stopPropagation();
    if (els.filterMenu.hidden) openFilterMenu(); else closeFilterMenu();
  });

  els.filterMenu.addEventListener("click", function (event) {
    var option = event.target.closest(".filter-option");
    if (!option) return;
    state.account = option.getAttribute("data-account");
    closeFilterMenu();
    renderList();
  });

  document.addEventListener("click", function (event) {
    if (els.filterMenu.hidden) return;
    if (els.filterMenu.contains(event.target) || els.filterTrigger.contains(event.target)) return;
    closeFilterMenu();
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") closeFilterMenu();
  });

  window.addEventListener("resize", function () {
    if (!els.filterMenu.hidden) positionFilterMenu();
  });

  els.mailList.addEventListener("click", function (event) {
    var row = event.target.closest(".mail-row");
    if (row) openMail(row.getAttribute("data-id"));
  });

  els.mailList.addEventListener("keydown", function (event) {
    if (event.key !== "Enter" && event.key !== " ") return;
    var row = event.target.closest(".mail-row");
    if (!row) return;
    event.preventDefault();
    openMail(row.getAttribute("data-id"));
  });

  els.backBtn.addEventListener("click", showList);

  els.importance.addEventListener("click", function (event) {
    var btn = event.target.closest(".imp-btn");
    if (!btn || !state.current) return;
    state.current.importance = btn.getAttribute("data-importance");
    updateImportanceUI();
    renderList();
    var labels = { normal: "一般", important: "重要", critical: "严重" };
    showToast("已标记为" + labels[state.current.importance]);
  });

  els.copyTextBtn.addEventListener("click", copyCurrentText);

  els.detailBody.addEventListener("click", function (event) {
    var btn = event.target.closest(".img-copy");
    if (!btn) return;
    var figure = btn.closest(".inline-image");
    var img = figure ? figure.querySelector("img") : null;
    if (img) copyImage(img);
  });

  els.settingsBtn.addEventListener("click", function () {
    closeFilterMenu();
    renderAccounts();
    els.accountSheet.hidden = false;
  });

  els.closeSheetBtn.addEventListener("click", function () {
    els.accountSheet.hidden = true;
  });

  els.addAccountBtn.addEventListener("click", function () {
    showToast("添加账号流程不在本次原型范围");
  });

  /* 卡片聚焦状态 */
  els.card.addEventListener("mousedown", function () {
    els.card.focus({ preventScroll: true });
  });
  els.card.addEventListener("focus", function () {
    els.card.classList.add("focused");
    els.footerHint.innerHTML =
      "卡片已聚焦 · <kbd>Alt</kbd> + 方向键移动 · <kbd>H</kbd> 隐藏";
  });
  els.card.addEventListener("blur", function () {
    els.card.classList.remove("focused");
    els.footerHint.innerHTML =
      '<kbd>H</kbd> 隐藏/显示 · 点击卡片后 <kbd>Alt</kbd> + 方向键移动';
  });

  /* H 键隐藏 / 显示（模拟全局快捷键） */
  document.addEventListener("keydown", function (event) {
    if (event.key.toLowerCase() !== "h") return;
    if (event.altKey || event.ctrlKey || event.metaKey) return;

    closeFilterMenu();
    var hidden = els.card.classList.toggle("is-hidden");
    if (hidden) {
      els.desktopHint.innerHTML = '按 <kbd>H</kbd> 呼出邮件卡片';
    } else {
      els.desktopHint.innerHTML =
        '原型：按 <kbd>H</kbd> 隐藏卡片 · 点击卡片后 <kbd>Alt</kbd> + 方向键移动';
      els.card.focus({ preventScroll: true });
    }
  });

  /* Alt + 方向键移动（仅卡片聚焦时生效） */
  els.card.addEventListener("keydown", function (event) {
    if (!event.altKey) return;
    var keys = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"];
    if (keys.indexOf(event.key) === -1) return;

    event.preventDefault();
    var step = 16;
    var rect = els.card.getBoundingClientRect();
    var left = rect.left;
    var top = rect.top;

    if (event.key === "ArrowLeft") left -= step;
    if (event.key === "ArrowRight") left += step;
    if (event.key === "ArrowUp") top -= step;
    if (event.key === "ArrowDown") top += step;

    left = Math.max(8, Math.min(window.innerWidth - rect.width - 8, left));
    top = Math.max(8, Math.min(window.innerHeight - rect.height - 8, top));

    els.card.style.left = left + "px";
    els.card.style.top = top + "px";
    if (!els.filterMenu.hidden) positionFilterMenu();
  });

  /* ---------------- 启动 ---------------- */
  els.accountCount.textContent = String(Object.keys(ACCOUNTS).length);
  renderList();
  els.card.focus({ preventScroll: true });

  /* 原型辅助：直接用 hash 打开特定状态（用于评审截图） */
  if (location.hash === "#detail") {
    openMail("m3");
  }
  if (location.hash === "#accounts") {
    openFilterMenu();
  }
  if (location.hash === "#manage") {
    renderAccounts();
    els.accountSheet.hidden = false;
  }
})();
</script>
</body>
</html>
